<main class="app" data-gallery="true" data-panel="none">
<header class="app-header"><div class="identity"><a class="brand author-link" href="https://amirmushich.com/lab/anatomy/" title="About Anatomy by Amir Mushich">Anatomy</a><span class="divider"></span><h1 id="object-title">Objects</h1></div><div class="header-actions"><div class="object-nav"><button id="object-prev" aria-label="Previous object">←</button><span id="object-index">01 / 12</span><button id="object-next" aria-label="Next object">→</button></div><button id="gallery-toggle" aria-expanded="true" aria-controls="gallery">Objects <span>12</span></button></div></header>
<section class="viewport" id="viewport" aria-label="Interactive object scene">
<div class="scene-stage"><canvas id="scene" tabindex="0" role="img" aria-label="Drag to orbit. Wheel or pinch to zoom. Click a part to inspect."></canvas><div id="fallback" hidden><img id="fallback-image" alt="Static preview"><p>3D requires WebGL 2.</p></div><div id="hover-label" hidden></div><svg id="leader" class="leader" aria-hidden="true" hidden><path/><circle r="3"/></svg><div class="scene-hint"><span class="desktop-hint">Drag to orbit · scroll to zoom · click to inspect</span><span class="touch-hint">Drag to orbit · pinch to zoom · tap to inspect</span><button id="dismiss-hint" aria-label="Dismiss interaction hint">×</button></div><div class="zoom-tools"><div class="segment"><button id="zoom-out" aria-label="Zoom out">−</button><button id="fit">Fit</button><button id="zoom-in" aria-label="Zoom in">+</button></div><span id="zoom-value">100%</span></div></div>
<aside id="inspector" class="inspector" hidden aria-label="Object inspector"><div class="panel-heading"><span id="panel-title">Controls</span><span class="section-number" id="panel-number">01</span><button id="close-panel" aria-label="Close inspector">×</button></div><nav id="panel-tabs" class="segment panel-tabs" aria-label="Inspector views"><button data-tab="mechanism" aria-pressed="true">Mechanism</button><button data-tab="speed" aria-pressed="false">Speed</button><button data-tab="view" aria-pressed="false">View</button><button data-tab="parts" aria-pressed="false">Parts</button></nav>
<div id="mechanism-panel" class="panel-body"><div id="secondary-options" class="field"><span id="secondary-label">Detail</span><div id="mode-options" class="segment"></div><button id="inspect-switch">Switch</button></div><label id="parameter" class="range-field" hidden><span class="field-heading"><span id="parameter-label"></span><output id="parameter-value"></output></span><input id="parameter-input" type="range"></label></div><div id="speed-panel" class="panel-body" hidden><div class="range-field"><span class="field-heading"><span>Playback speed</span><output id="speed-value">1×</output></span><div class="segment"><button id="normal-speed" aria-pressed="true">1×</button><button id="slow" aria-pressed="false">0.18× <kbd>S</kbd></button></div></div></div>
<div id="view-panel" class="panel-body" hidden><label class="range-field"><span class="field-heading"><span>Separation</span><output id="separation-value">0%</output></span><input id="separation-input" type="range" min="0" max="100" step="1" value="0"></label><div class="segment"><button id="explode" aria-pressed="false">Separate <kbd>E</kbd></button><button id="rejoin">Assembled</button></div><div class="view-actions"><button id="home">Reset camera</button><button id="reset">Reset mechanism</button></div></div>
<div id="parts-panel" class="panel-body" hidden><div id="parts-menu" aria-label="Part groups"></div><nav class="parts-pages" aria-label="Part pages"><button id="parts-prev" aria-label="Previous parts">←</button><span id="parts-status">1 / 1</span><button id="parts-next" aria-label="Next parts">→</button></nav></div>
<div id="callout" class="panel-body" hidden><h2 id="part-title"></h2><p id="part-description"></p><div class="callout-actions"><span id="part-mode">Selected part</span><button id="close-part" aria-label="Clear selection">Clear</button></div><button id="focus-part">Focus part <span>↗</span></button></div></aside>
<section id="gallery" class="gallery" aria-label="Object presets"><div class="gallery-grid"><!--CARDS--></div><nav class="gallery-pages" aria-label="Gallery pages"><a class="source-link" href="https://github.com/amirmushichge/anatomy" target="_blank" rel="noopener">Source ↗</a><button id="page-prev" aria-label="Previous presets">←</button><span id="page-status" aria-live="polite"></span><button id="page-next" aria-label="Next presets">→</button></nav></section>
</section><footer class="dock" id="dock"><div class="controls"><button id="press" class="primary">Press key <kbd>↵</kbd></button><button id="controls-toggle" aria-expanded="false" aria-controls="inspector">Controls</button><button id="parts-toggle" aria-expanded="false" aria-controls="inspector">Inspect</button></div><div class="readouts" data-readout><div><span id="readout-a-label">Presses</span><output id="readout-a">00</output></div><div><span id="readout-b-label">Travel</span><output id="readout-b">0.0 mm</output></div><div><span id="readout-c-label">Contact</span><output id="readout-c">Open</output></div></div></footer><div id="announce" class="sr-only" aria-live="polite"></div></main>
